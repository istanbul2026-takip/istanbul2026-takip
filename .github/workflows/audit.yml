name: Audit data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit.mjs
      - if: always()
        run: |
          mkdir /tmp/o && cp data/audit-*.json /tmp/o/ && cd /tmp/o && git init -q && git checkout -q -b audit && git add . && git -c user.name=audit -c user.email=a@a commit -qm audit && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" audit
