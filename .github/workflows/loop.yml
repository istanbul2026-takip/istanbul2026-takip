name: Live updater
# Keeps one long-running job alive during the event; each job hands over to a new one.
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * 10-15 11 *'    # (re)starter; queues behind a running job
permissions:
  contents: read
  actions: write
concurrency:
  group: live-updater
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: data/last.json
          key: wdsf-data-${{ github.run_id }}
          restore-keys: wdsf-data-
      - name: Check and publish every 5 minutes
        run: node scripts/loop.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/last.json') != ''
        with:
          path: data/last.json
          key: wdsf-data-${{ github.run_id }}-live
      - name: Hand over to a new run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-15 22:00' +%s)" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches" -d '{"ref":"main"}'
            echo "next run requested"
          fi
