<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7C1528">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="İstanbul 2026">
<title>İstanbul 2026 · Yarışma Programı</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#7C1528;color:#211A25;padding:20px;box-sizing:border-box}
.box{width:100%;max-width:360px;background:#F4F2F6;border-radius:20px;padding:26px 22px}
.k{font-size:15px;font-weight:800;color:#7C1528;letter-spacing:.02em}
h1{font-size:26px;margin:2px 0 6px;line-height:1.15}p{color:#6E6574;font-size:15px;margin:0 0 18px;line-height:1.45}
input[type=password]{width:100%;box-sizing:border-box;border:1px solid #DFD9E4;background:#fff;color:#211A25;border-radius:12px;padding:13px;font-size:16px}
input[type=password]:focus{outline:2px solid #7C1528;outline-offset:-1px}
button{width:100%;margin-top:14px;border:none;border-radius:12px;min-height:48px;font-size:16px;font-weight:700;background:#211A25;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:#6E6574;margin-top:14px}
.err{color:#D21F3C;font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
<form class="box" id="f"><div class="k">İstanbul 2026</div><h1>Yarışma programı<br><span style="font-weight:500;color:#6E6574;font-size:18px">Competition schedule</span></h1><p>Devam etmek için şifreyi gir.<br>Enter the password to continue.</p>
<input type="password" id="pw" placeholder="Şifre / Password" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="rem" checked> Bu cihazda hatırla · Remember me</label>
<button type="submit" id="go">Giriş · Enter</button><div class="err" id="err"></div>
<p style="font-size:12.5px;margin:14px 0 0">Bağımsız takip sayfası, resmi WDSF sitesi değildir.<br>Independent page, not an official WDSF site.</p></form>
<script>
const S="__S__",I="__I__",C="__C__",N=__N__;
const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const b=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const KEY='wdsfist-k';
async function fromPw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function dec(key){ return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(C))); }
function show(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.title = doc.title;
  document.documentElement.lang = doc.documentElement.lang || 'tr';
  document.querySelectorAll('head style').forEach(x => x.remove());
  doc.head.querySelectorAll('style').forEach(x => document.head.appendChild(document.importNode(x, true)));
  const body = document.importNode(doc.body, true);
  const scripts = [...body.querySelectorAll('script')];
  scripts.forEach(x => x.remove());
  document.body.replaceWith(body);
  scripts.forEach(x => { const n = document.createElement('script'); n.textContent = x.textContent; document.body.appendChild(n); });
}
try{ localStorage.removeItem('wdsfist-pw'); }catch(e){}
let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
const go=document.getElementById('go'), err=document.getElementById('err');
if(saved){ go.disabled=true; go.textContent='…';
  crypto.subtle.importKey('raw',u(saved),'AES-GCM',false,['decrypt']).then(dec).then(show)
    .catch(()=>{ try{localStorage.removeItem(KEY)}catch(e){} go.disabled=false; go.textContent='Giriş · Enter'; }); }
let busy=false;
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); if(busy) return; const pw=document.getElementById('pw').value.trim(); if(!pw) return;
  busy=true; go.disabled=true; go.textContent='…'; err.textContent='';
  try{ const key=await fromPw(pw); const h=await dec(key);
    if(document.getElementById('rem').checked){ try{ localStorage.setItem(KEY,b(await crypto.subtle.exportKey('raw',key))); }catch(e){} }
    show(h); }
  catch(x){ await new Promise(r=>setTimeout(r,900)); err.textContent='Şifre yanlış. · Wrong password.'; go.disabled=false; go.textContent='Giriş · Enter'; busy=false; }
};
</script></body></html>
